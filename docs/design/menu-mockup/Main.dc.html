<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R5 Deskbar menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ p.root }}">
  <svg aria-hidden="true" width="980" height="640" viewBox="0 0 980 640" style="position: absolute; left: 0; top: 0">
    <path d="M0,200 C200,150 360,200 520,270 C690,340 840,350 980,320 L980,640 L0,640 Z" fill="{{ p.wave1 }}"></path>
    <path d="M0,380 C220,340 400,400 590,470 C750,530 880,530 980,500 L980,640 L0,640 Z" fill="{{ p.wave2 }}"></path>
  </svg>

  <div style="position: absolute; left: 12px; top: 12px; display: flex; gap: 22px; font-size: 12px; color: {{ p.deskText }}">
    <div style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 6px; background: linear-gradient(135deg, #e4e7ec, #9aa3b0)"></span>R5</div>
    <div style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 34px; margin-top: 6px; border-radius: 4px; background: linear-gradient(#f3c66a, #d99a2b)"></span>home</div>
    <div style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 32px; height: 40px; border-radius: 4px 4px 8px 8px; background: linear-gradient(#3fd19b, #12936a)"></span>Trash</div>
  </div>

  <div style="{{ p.deskbar }}">
    <div style="{{ p.logoRow }}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="{{ p.accent }}"></circle><path d="M54,24 C42,24 37,32 43,42 C49,51 46,62 35,66 C26,69 27,77 41,77 C64,77 77,64 77,48 C77,33 66,24 54,24 Z" fill="#ffffff"></path></svg>
    </div>
    <div style="height: 1px; background: {{ p.hair }}"></div>
    <div style="height: 34px; display: flex; align-items: center; gap: 13px; padding: 0 14px; color: {{ p.text }}">
      <span style="flex: 1"></span>
      <span style="font-size: 12.5px; font-weight: 700">3:12 PM</span>
    </div>
    <div style="height: 1px; background: {{ p.hair }}"></div>
    <div style="padding: 6px">
      <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; font-size: 13px; color: {{ p.muted }}"><span style="width: 18px; height: 18px; border-radius: 4px; background: #b98b4e"></span>Tracker</div>
      <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; font-size: 13px; color: {{ p.muted }}"><span style="width: 18px; height: 18px; border-radius: 4px; background: #e8c34a"></span>StyledEdit</div>
      <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; font-size: 13px; color: {{ p.muted }}"><span style="width: 18px; height: 18px; border-radius: 4px; background: #5b6b84"></span>Terminal</div>
    </div>
  </div>

  <div style="{{ p.menu }}">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="16">
      <sc-if value="{{ it.sep }}" hint-placeholder-val="{{ false }}"><div style="{{ p.sep }}"></div></sc-if>
      <sc-if value="{{ it.isRow }}" hint-placeholder-val="{{ true }}">
        <div style="{{ it.row }}">
          <span style="{{ it.icon }}"></span>
          <span style="flex: 1">{{ it.label }}</span>
          <sc-if value="{{ it.sub }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.8 6.8 5 3.5 8.2"></path></svg></sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="{{ p.submenu }}">
    <sc-for list="{{ apps }}" as="it" hint-placeholder-count="8">
      <div style="{{ it.row }}">
        <span style="{{ it.icon }}"></span>
        <span style="flex: 1">{{ it.label }}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 24px; bottom: 20px; max-width: 460px; font-size: 12px; line-height: 1.5; color: {{ p.deskText }}">{{ footer }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"safe":{"editor":"boolean","default":false},"$preview":{"width":980,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const safe = this.props.safe ?? false;
    const stepped = 'clip-path: polygon(0 6px, 2px 6px, 2px 3px, 3px 3px, 3px 2px, 6px 2px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 2px, calc(100% - 3px) 2px, calc(100% - 3px) 3px, calc(100% - 2px) 3px, calc(100% - 2px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 2px) calc(100% - 6px), calc(100% - 2px) calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) calc(100% - 2px), calc(100% - 6px) calc(100% - 2px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 2px), 3px calc(100% - 2px), 3px calc(100% - 3px), 2px calc(100% - 3px), 2px calc(100% - 6px), 0 calc(100% - 6px));';
    const c = dark ? {
      bg: '#17202f', wave1: '#1e2a3f', wave2: '#24344f', deskText: '#c9cfd9',
      text: '#e6e9ef', muted: '#c9cfd9', dim: '#8a93a3', hair: 'rgba(255,255,255,0.08)', accent: '#2f95ff',
      glass: 'rgba(30,34,43,0.80)', opaque: '#262b34', line: 'rgba(255,255,255,0.10)', lineSafe: '#3a404c',
      deskGlass: 'rgba(22,26,34,0.72)', deskOpaque: '#1c2029', sep: 'rgba(255,255,255,0.10)', sepSafe: '#3a404c',
      shadow: '0 14px 34px rgba(0,0,0,0.50), 0 2px 6px rgba(0,0,0,0.35)'
    } : {
      bg: '#dfe6ef', wave1: '#cfd9e6', wave2: '#bfcde0', deskText: '#3a4250',
      text: '#1a1d23', muted: '#3a4250', dim: '#6b7380', hair: 'rgba(0,0,0,0.08)', accent: '#0084ff',
      glass: 'rgba(250,251,253,0.82)', opaque: '#f7f8fa', line: 'rgba(0,0,0,0.10)', lineSafe: '#b8c0cc',
      deskGlass: 'rgba(246,248,251,0.74)', deskOpaque: '#eef1f5', sep: 'rgba(0,0,0,0.09)', sepSafe: '#d3d8e0',
      shadow: '0 14px 34px rgba(20,30,50,0.22), 0 2px 6px rgba(20,30,50,0.14)'
    };
    const box = (left, top, width) => safe
      ? 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + width + 'px; box-sizing: border-box; padding: 5px; background: ' + c.opaque + '; border: 1px solid ' + c.lineSafe + '; font-size: 13px; color: ' + c.text + '; ' + stepped
      : 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + width + 'px; box-sizing: border-box; padding: 5px; background: ' + c.glass + '; backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-radius: 10px; box-shadow: inset 0 0 0 1px ' + c.line + ', ' + c.shadow + '; font-size: 13px; color: ' + c.text;
    const p = {
      root: 'width: 980px; height: 640px; position: relative; overflow: hidden; background: ' + c.bg + '; font-family: Manrope, system-ui, sans-serif; color: ' + c.text,
      wave1: c.wave1, wave2: c.wave2, deskText: c.deskText, text: c.text, muted: c.muted, hair: c.hair, accent: c.accent,
      deskbar: safe
        ? 'position: absolute; right: 14px; top: 14px; width: 214px; box-sizing: border-box; background: ' + c.deskOpaque + '; border: 1px solid ' + c.lineSafe + '; overflow: hidden; ' + stepped
        : 'position: absolute; right: 14px; top: 14px; width: 214px; box-sizing: border-box; background: ' + c.deskGlass + '; backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); border: 1px solid ' + c.hair + '; border-radius: 18px; box-shadow: ' + c.shadow + '; overflow: hidden',
      logoRow: 'height: 42px; display: flex; align-items: center; justify-content: center; background: ' + (dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)'),
      menu: box(722, 58, 244),
      submenu: box(518, 197, 200),
      sep: 'height: 1px; margin: 4px 8px; background: ' + (safe ? c.sepSafe : c.sep)
    };
    const rowStyle = (hot, dis) => 'height: 26px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border-radius: ' + (safe ? '0' : '6px') + '; ' + (hot ? 'background: ' + c.accent + '; color: #ffffff; font-weight: 600' : 'color: ' + (dis ? c.dim : c.text));
    const iconStyle = (col) => 'width: 16px; height: 16px; flex: none; border-radius: 4px; background: ' + (col || 'transparent');
    const mk = (label, col, opts) => {
      const o = opts || {};
      return { isRow: true, sep: false, label: label, sub: !!o.sub, row: rowStyle(o.hot, o.dis), icon: iconStyle(col) };
    };
    const S = { sep: true, isRow: false };
    const items = [
      mk('About R5', '#0084ff'), mk('Find…', '#8a6fd1'), mk('Show replicants', null), mk('Mount', '#9aa3b0', { sub: true }), mk('Deskbar settings…', '#7f8a99'),
      S,
      mk('Applications', '#4a7fd6', { sub: true, hot: true }), mk('Demos', '#d16f8a', { sub: true }), mk('Desktop applets', '#3fb58a', { sub: true }), mk('Preferences', '#7f8a99', { sub: true }),
      S,
      mk('Recent documents', '#e0a54a', { sub: true }), mk('Recent folders', '#d99a2b', { sub: true }), mk('Recent applications', '#4a7fd6', { sub: true }),
      S,
      mk('Log out…', null), mk('Restart', null), mk('Shut down', null)
    ];
    const apps = [
      mk('Aomi', '#2f95ff'), mk('Mail', '#6fa8dc'), mk('MediaPlayer', '#d16f8a'), mk('People', '#e0a54a'),
      mk('StyledEdit', '#e8c34a', { hot: false }), mk('Terminal', '#5b6b84'), mk('Tracker', '#b98b4e'), mk('Vulkan Teapot', '#3fb58a')
    ];
    return {
      p, items, apps,
      footer: (dark ? 'R5 Modern, dark' : 'R5 Modern, light') + ' · ' + (safe ? 'without effects or in Safe mode (CPU): the same colours, opaque, stepped corners, no blur or shadow.' : 'GPU: frosted glass and a soft shadow. Highlight in the accent, submenu opens away from the screen edge.')
    };
  }
}
</script>
</body>
</html>
