<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R5 Tracker menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{ p.root }}">
  <svg aria-hidden="true" width="1100" height="700" viewBox="0 0 1100 700" style="position: absolute; left: 0; top: 0">
    <path d="M0,230 C230,170 420,240 610,320 C800,400 960,410 1100,370 L1100,700 L0,700 Z" fill="{{ p.wave1 }}"></path>
    <path d="M0,430 C260,380 470,450 690,540 C880,610 1010,610 1100,580 L1100,700 L0,700 Z" fill="{{ p.wave2 }}"></path>
  </svg>

  <div style="{{ p.tab }}">
    <span style="{{ p.tabBox }}"></span>
    <span style="font-size: 13px; font-weight: 700">home</span>
  </div>
  <div style="{{ p.win }}">
    <div style="{{ p.menubar }}">
      <span style="{{ p.barHot }}">File</span>
      <span style="padding: 0 9px">Edit</span>
      <span style="padding: 0 9px">Window</span>
      <span style="padding: 0 9px">Attributes</span>
      <span style="padding: 0 9px">Add-ons</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px 10px; padding: 26px 24px; font-size: 12px; color: {{ p.text }}">
      <sc-for list="{{ files }}" as="f" hint-placeholder-count="10">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="{{ f.icon }}"></span>
          <span style="{{ f.label }}">{{ f.name }}</span>
        </div>
      </sc-for>
    </div>
    <div style="{{ p.status }}">10 items · 4.2 GiB free</div>
  </div>

  <div style="{{ p.fileMenu }}">
    <sc-for list="{{ fileItems }}" as="it" hint-placeholder-count="14">
      <sc-if value="{{ it.sep }}" hint-placeholder-val="{{ false }}"><div style="{{ p.sep }}"></div></sc-if>
      <sc-if value="{{ it.isRow }}" hint-placeholder-val="{{ true }}">
        <div style="{{ it.row }}">
          <span style="flex: 1">{{ it.label }}</span>
          <span style="{{ it.key }}">{{ it.short }}</span>
          <sc-if value="{{ it.sub }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.8 6.8 5 3.5 8.2"></path></svg></sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="{{ p.ctxMenu }}">
    <sc-for list="{{ ctxItems }}" as="it" hint-placeholder-count="14">
      <sc-if value="{{ it.sep }}" hint-placeholder-val="{{ false }}"><div style="{{ p.sep }}"></div></sc-if>
      <sc-if value="{{ it.isRow }}" hint-placeholder-val="{{ true }}">
        <div style="{{ it.row }}">
          <span style="flex: 1">{{ it.label }}</span>
          <span style="{{ it.key }}">{{ it.short }}</span>
          <sc-if value="{{ it.sub }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.8 6.8 5 3.5 8.2"></path></svg></sc-if>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="{{ p.subMenu }}">
    <sc-for list="{{ openWith }}" as="it" hint-placeholder-count="5">
      <sc-if value="{{ it.sep }}" hint-placeholder-val="{{ false }}"><div style="{{ p.sep }}"></div></sc-if>
      <sc-if value="{{ it.isRow }}" hint-placeholder-val="{{ true }}">
        <div style="{{ it.row }}">
          <span style="width: 12px; display: flex; justify-content: center"><sc-if value="{{ it.check }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.8 9 10 3"></path></svg></sc-if></span>
          <span style="{{ it.icon }}"></span>
          <span style="flex: 1">{{ it.label }}</span>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="position: absolute; left: 720px; top: 70px; width: 340px; font-size: 12px; line-height: 1.55; color: {{ p.deskText }}">{{ caption }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1100,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const c = dark ? {
      bg: '#17202f', wave1: '#1e2a3f', wave2: '#24344f', deskText: '#c9cfd9',
      text: '#e6e9ef', dim: '#7d8696', key: '#9aa3b0', accent: '#2f95ff',
      win: '#1f232b', bar: '#262b34', barLine: '#3a404c', winLine: 'rgba(255,255,255,0.10)',
      tab: 'linear-gradient(#f0c63a, #e8b923)', tabLine: 'rgba(60,40,0,0.55)',
      glass: 'rgba(30,34,43,0.80)', line: 'rgba(255,255,255,0.10)', sep: 'rgba(255,255,255,0.10)',
      shadow: '0 14px 34px rgba(0,0,0,0.50), 0 2px 6px rgba(0,0,0,0.35)', winShadow: '0 20px 44px rgba(0,0,0,0.50), 0 4px 10px rgba(0,0,0,0.35)',
      barHot: 'rgba(255,255,255,0.10)', selBg: 'rgba(47,149,255,0.28)'
    } : {
      bg: '#dfe6ef', wave1: '#cfd9e6', wave2: '#bfcde0', deskText: '#3a4250',
      text: '#1a1d23', dim: '#9aa1ad', key: '#6b7380', accent: '#0084ff',
      win: '#ffffff', bar: '#eef1f5', barLine: '#d3d8e0', winLine: 'rgba(0,0,0,0.12)',
      tab: 'linear-gradient(#ffe066, #ffcb00)', tabLine: 'rgba(120,90,0,0.45)',
      glass: 'rgba(250,251,253,0.82)', line: 'rgba(0,0,0,0.10)', sep: 'rgba(0,0,0,0.09)',
      shadow: '0 14px 34px rgba(20,30,50,0.22), 0 2px 6px rgba(20,30,50,0.14)', winShadow: '0 18px 40px rgba(20,30,50,0.20), 0 3px 8px rgba(20,30,50,0.12)',
      barHot: 'rgba(0,0,0,0.07)', selBg: 'rgba(0,132,255,0.16)'
    };
    const box = (left, top, width) => 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + width + 'px; box-sizing: border-box; padding: 5px; background: ' + c.glass + '; backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); border-radius: 10px; box-shadow: inset 0 0 0 1px ' + c.line + ', ' + c.shadow + '; font-size: 13px; color: ' + c.text;
    const p = {
      root: 'width: 1100px; height: 700px; position: relative; overflow: hidden; background: ' + c.bg + '; font-family: Manrope, system-ui, sans-serif; color: ' + c.text,
      wave1: c.wave1, wave2: c.wave2, deskText: c.deskText, text: c.text,
      tab: 'position: absolute; left: 40px; top: 38px; width: 200px; height: 44px; box-sizing: border-box; border-radius: 14px 14px 0 0; background: ' + c.tab + '; border: 1px solid ' + c.tabLine + '; display: flex; align-items: flex-start; gap: 9px; padding: 9px 12px 0 12px; color: #1a1a1a',
      tabBox: 'width: 13px; height: 13px; box-sizing: border-box; margin-top: 1px; border-radius: 3px; background: rgba(255,255,255,0.45); border: 1px solid ' + c.tabLine,
      win: 'position: absolute; left: 40px; top: 70px; width: 640px; height: 500px; box-sizing: border-box; background: ' + c.win + '; border-radius: 14px; box-shadow: inset 0 0 0 1px ' + c.winLine + ', ' + c.winShadow + '; overflow: hidden',
      menubar: 'height: 28px; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 12px; background: ' + c.bar + '; border-bottom: 1px solid ' + c.barLine + '; font-size: 12.5px',
      barHot: 'padding: 3px 9px; border-radius: 6px; background: ' + c.barHot + '; font-weight: 600',
      status: 'position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; align-items: center; padding: 0 14px; font-size: 11.5px; color: ' + c.key + '; background: ' + c.bar + '; border-top: 1px solid ' + c.barLine,
      fileMenu: box(52, 100, 236),
      ctxMenu: box(420, 262, 236),
      subMenu: box(660, 289, 200),
      sep: 'height: 1px; margin: 4px 8px; background: ' + c.sep
    };
    const rowStyle = (hot, dis) => 'height: 26px; display: flex; align-items: center; gap: 9px; padding: 0 9px 0 11px; border-radius: 6px; ' + (hot ? 'background: ' + c.accent + '; color: #ffffff; font-weight: 600' : 'color: ' + (dis ? c.dim : c.text));
    const keyStyle = (hot) => 'font-size: 11.5px; font-weight: 500; color: ' + (hot ? 'rgba(255,255,255,0.85)' : c.key);
    const mk = (label, short, o) => {
      o = o || {};
      return { isRow: true, sep: false, label: label, short: short || '', sub: !!o.sub, check: !!o.check, row: rowStyle(o.hot, o.dis), key: keyStyle(o.hot), icon: 'width: 16px; height: 16px; flex: none; border-radius: 4px; background: ' + (o.col || 'transparent') };
    };
    const S = { sep: true, isRow: false };
    const fileItems = [
      mk('Find…', 'Alt+F'), mk('New', '', { sub: true }), S,
      mk('Open', 'Alt+O', { hot: true }), mk('Open with', '', { sub: true }), mk('Get info', 'Alt+I'), mk('Edit name', 'Alt+E'), mk('Duplicate', 'Alt+D'), mk('Move to Trash', 'Alt+T'), S,
      mk('Copy to', '', { sub: true }), mk('Move to', '', { sub: true }), mk('Create link', '', { sub: true }), S,
      mk('Close', 'Alt+W'), mk('Close all', 'Shift+Alt+W', { dis: true })
    ];
    const ctxItems = [
      mk('Open', 'Alt+O'), mk('Open with', '', { sub: true, hot: true }), mk('Get info', 'Alt+I'), mk('Edit name', 'Alt+E'), mk('Duplicate', 'Alt+D'), mk('Move to Trash', 'Alt+T'), S,
      mk('Cut', 'Alt+X'), mk('Copy', 'Alt+C'), mk('Paste', 'Alt+V', { dis: true }), S,
      mk('Identify', ''), mk('Add-ons', '', { sub: true })
    ];
    const openWith = [
      mk('StyledEdit', '', { check: true, col: '#e8c34a' }), mk('Aomi', '', { col: '#2f95ff' }), mk('Pe', '', { col: '#8a6fd1' }), S,
      mk('Other…', '')
    ];
    const ic = (col, sel) => 'width: 44px; height: 44px; border-radius: 8px; background: ' + col + (sel ? '; box-shadow: 0 0 0 3px ' + c.selBg : '');
    const lb = (sel) => 'padding: 1px 6px; border-radius: 4px; max-width: 100px; text-align: center; ' + (sel ? 'background: ' + c.accent + '; color: #ffffff' : '');
    const names = [['config', '#d99a2b'], ['Desktop', '#d99a2b'], ['Documents', '#d99a2b'], ['Music', '#d99a2b'], ['Pictures', '#d99a2b'], ['plan.pdf', '#d16f8a'], ['photo.jpg', '#3fb58a'], ['song.flac', '#4a7fd6'], ['notes.txt', '#e8c34a', true], ['Untitled', '#9aa3b0']];
    const files = names.map((n) => ({ name: n[0], icon: ic(n[1], n[2]), label: lb(n[2]) }));
    return {
      p, fileItems, ctxItems, openWith, files,
      caption: 'Left: the File menu from the menu bar, with shortcuts on the right and a disabled item. Right: the menu after a right click on notes.txt, with Open with open; the check marks the preferred program. ' + (dark ? 'Dark: the same shapes, menu glass over the dark slate.' : 'Light: frosted glass with a soft shadow (GPU).')
    };
  }
}
</script>
</body>
</html>
